name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

        package:
          - core/gcc

    name: "${{ matrix.package }} (${{ matrix.os.arch }})"

    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      SCCACHE_GHA_ENABLED: true

    runs-on: ${{ matrix.os.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup ccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: build
        run: |
          chmod +x makepkg.sh
          ./makepkg.sh "${{ matrix.package }}"
        env:
          ARCH: ${{ matrix.os.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: artifacts/*
          name: ${{ matrix.os.arch }}-${{ matrix.package }}

  release:
    name: "release"
    needs: [build]
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v2.3.3
        with:
          name: "Continuous build"
          tag_name: continuous
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            *.pkg.tar.zst
            *.pkg.tar.xz
